[build]
  command = "npm run build"
  publish = "dist"

# Posters are hotlinked from these hosts and served through Netlify Image
# CDN (see src/lib/poster.js), which only proxies allow-listed origins.
[images]
  remote_images = [
    "https://static-ca-cdn\\.eporner\\.com/.*",
    "https://static-eu-cdn\\.eporner\\.com/.*",
    "https://imggen\\.eporner\\.com/.*",
    "https://i\\.ytimg\\.com/.*",
  ]

[[redirects]]
  from = "/video/*"
  to = "/movies/:splat"
  status = 301

# Public pages are prerendered to static files by scripts/prerender.mjs and
# served directly. Everything else (admin, search, paginated pages, unknown
# slugs) falls back to the plain SPA shell.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Vite's build output hashes filenames (e.g. index-AIB3pHt8.js) — the
# content of a given hashed filename never changes, so it's safe for
# browsers to cache these forever. This makes repeat visits load
# instantly for anything that hasn't actually changed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML references the current hashed asset filenames, so it must always be
# re-fetched — otherwise visitors could get a stale page pointing at assets
# that no longer exist after a new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
