[build]
  command = "npm run build"
  publish = "dist"

# Posters are hotlinked from these hosts and served through Netlify Image
# CDN (see src/lib/poster.js), which only proxies allow-listed origins.
[images]
  remote_images = [
    "https://static-ca-cdn\\.eporner\\.com/.*",
    "https://static-eu-cdn\\.eporner\\.com/.*",
    "https://imggen\\.eporner\\.com/.*",
    "https://i\\.ytimg\\.com/.*",
    # Posters for the AI-channel movies (signed URLs) and one older Eporner
    # poster. Not allow-listed before, so the Image CDN answered 400 and the
    # card had to fall back to the raw image.
    "https://pix-egi\\.phncdn\\.com/.*",
    "https://static\\.eporner\\.com/.*",
  ]

# Legacy pre-rebrand CineVault URL scheme (/video/:id/:slug). There's no
# reliable old-ID → new-slug mapping, so this sends stragglers to the
# listing page instead of the old (now-broken) "/movies/:splat" target,
# which isn't a real route and was serving an un-noindexed soft-404.
[[redirects]]
  from = "/video/*"
  to = "/movies"
  status = 301

# Browsers and crawlers request /favicon.ico by default even though the page
# links /favicon.svg; without this it fell through to the SPA shell below
# and was served as a 200 HTML page. Must stay above the catch-all.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301

