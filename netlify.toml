# Public pages are prerendered to static files by scripts/prerender.mjs and
# served directly. Everything else (admin, search, paginated pages, unknown
# slugs) falls back to the plain SPA shell.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Vite's build output hashes filenames (e.g. index-AIB3pHt8.js) — the
# content of a given hashed filename never changes, so it's safe for
# browsers to cache these forever. This makes repeat visits load
# instantly for anything that hasn't actually changed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML references the current hashed asset filenames, so it must always be
# re-fetched — otherwise visitors could get a stale page pointing at assets
# that no longer exist after a new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must be re-checked on every visit, or a fix to it would reach visitors late.
# The web app manifest is served with its proper type (it used to go out as a generic file).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# Every response is labelled as adult content (RTA label), matching the
# <meta name="rating"> tag that <Seo> puts on every page.
[[headers]]
  for = "/*"
  [headers.values]
    Rating = "RTA-5042-1996-1400-1577-RTA"
